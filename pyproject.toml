[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tama"
version = "0.6.0a1"
description = "Time-domain Adjoint with Memory-efficient Acceleration for Meep and FDTDX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "licenses/GPL-2.0-or-later.txt", "src/tama/backends/fdtdx/LICENSE"]
authors = [
  { name = "JaeHyeon Park" }
]
dependencies = [
  "autograd",
  "numpy",
  "scipy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
meep = ["tama-meep-native==0.6.0a1"]
fdtdx = [
  "fdtdx==0.6.2",
  "jax==0.11.0",
  "jaxlib==0.11.0",
  "equinox==0.13.8",
  "numpy>=2",
  "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/nanophotonics-lab/TAMA"
Documentation = "https://tama-adjoint.readthedocs.io/en/latest/"
Repository = "https://github.com/nanophotonics-lab/TAMA"
Issues = "https://github.com/nanophotonics-lab/TAMA/issues"

[dependency-groups]
docs = [
  "Sphinx==9.1.0",
  "myst-parser==5.1.0",
  "sphinx-rtd-theme==3.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tama*"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
"tama.backends.fdtdx" = ["*.json", "LICENSE", "THIRD_PARTY_NOTICES.txt"]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not fdtdx_gpu'"
markers = [
  "fdtdx_gpu: requires an actual CUDA device; run explicitly for release validation",
  "mpi2: tests scheduled with two MPI ranks",
  "mpi4: tests scheduled with four MPI ranks",
  "mpi8: tests scheduled with eight MPI ranks",
]

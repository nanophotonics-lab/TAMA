name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meep:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            numpy_spec: numpy
            run_tests: true
          - python-version: "3.12"
            numpy_spec: numpy
            run_tests: true
          - python-version: "3.13"
            numpy_spec: numpy
            run_tests: true
          - python-version: "3.12"
            numpy_spec: "numpy=1.26"
            run_tests: true
    env:
      OMP_NUM_THREADS: "1"
      PYTHONPATH: ""
      UCX_TLS: "tcp,self"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set temporary directory
        # Field histories can exceed the RAM-backed /tmp quota.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Create Meep environment
        uses: mamba-org/setup-micromamba@ce51e99f4bb8a82ab7158c4dc59ef4634c59c4f9 # v3
        with:
          environment-name: tama-ci
          cache-environment: true
          post-cleanup: all
          create-args: >-
            python=${{ matrix.python-version }}
            pymeep=1.34.0=mpi_mpich_*
            mpi4py=4.1.2
            mpich=4.3.2
            cxx-compiler
            cmake
            ninja
            gsl
            python-build
            setuptools>=77
            scikit-build-core
            twine
            autograd
            ${{ matrix.numpy_spec }}
            scipy
            pytest
            pip

      - name: Build and install source release
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dist" "${RUNNER_TEMP}/wheelhouse" "${RUNNER_TEMP}/release"
          python -m build --sdist --no-isolation \
            --outdir "${RUNNER_TEMP}/dist"
          python -m twine check "${RUNNER_TEMP}"/dist/*.tar.gz
          tar -xzf "${RUNNER_TEMP}"/dist/tama-*.tar.gz -C "${RUNNER_TEMP}/release"
          source_dir=$(find "${RUNNER_TEMP}/release" -mindepth 1 -maxdepth 1 -type d -name 'tama-*')
          python -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "${RUNNER_TEMP}/wheelhouse" \
            "${source_dir}" "${source_dir}/native/meep"
          python -m pip install --no-deps \
            "${RUNNER_TEMP}"/wheelhouse/*.whl
          python -m twine check "${RUNNER_TEMP}"/wheelhouse/*.whl
          echo "TAMA_RELEASE_SOURCE=${source_dir}" >> "$GITHUB_ENV"

      - name: Verify installed artifact
        shell: micromamba-shell {0}
        run: >-
          python -c "from importlib.machinery import EXTENSION_SUFFIXES;
          import importlib.util, os, pathlib, subprocess, tama;
          package_dir = pathlib.Path(tama.__file__).parent;
          assert (package_dir / 'py.typed').is_file();
          assert 'site-packages' in package_dir.parts;
          origin = importlib.util.find_spec('tama_meep_native.native_sampler').origin;
          print(origin);
          dynamic = subprocess.check_output(['readelf', '-d', origin], text=True);
          assert any(origin.endswith(suffix) for suffix in EXTENSION_SUFFIXES);
          assert '\u0024ORIGIN/../../..' in dynamic;
          assert os.environ['CONDA_PREFIX'] not in dynamic;
          assert tama.native_sampler_available()"

      - name: Verify validation environment
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          grep -q '^VERSION_ID="26.04"$' /etc/os-release
          df -hT /tmp "$TMPDIR"
          mpichversion | grep -Eq 'MPICH Version:[[:space:]]+4\.3\.2'
          python -c "import re, sys, meep, mpi4py; from mpi4py import MPI; \
          expected = tuple(map(int, '${{ matrix.python-version }}'.split('.'))); \
          assert sys.version_info[:2] == expected; \
          assert meep.__version__ == '1.34.0'; \
          assert mpi4py.__version__ == '4.1.2'; \
          assert re.search(r'MPICH Version:\s+4\.3\.2\b', MPI.Get_library_version())"

      - name: Verify NumPy 1.26 compatibility environment
        if: matrix.numpy_spec == 'numpy=1.26'
        shell: micromamba-shell {0}
        run: python -c "import numpy; assert numpy.__version__.startswith('1.26.')"

      - name: Run serial tests
        if: matrix.run_tests
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$TAMA_RELEASE_SOURCE"
          python -m pytest -v --durations=10 tests/common tests/meep

      - name: Run mpi2 test group
        if: matrix.run_tests
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$TAMA_RELEASE_SOURCE"
          mpirun -np 2 python -m pytest -q -p no:cacheprovider tests/meep -m mpi2

      - name: Run mpi4 test group
        if: matrix.run_tests
        shell: micromamba-shell {0}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$TAMA_RELEASE_SOURCE"
          mpirun -np 4 python -m pytest -q -p no:cacheprovider tests/meep -m mpi4

  fdtdx-cpu:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      PYTHONPATH: ""
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install pure release without Meep
        run: |
          python -m pip install "setuptools>=77" build twine pytest
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release"
          python -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          python -m twine check "$RUNNER_TEMP"/dist/*
          wheel=("$RUNNER_TEMP"/dist/tama-*-py3-none-any.whl)
          python -m pip install "${wheel[0]}[fdtdx]"
          tar -xzf "$RUNNER_TEMP"/dist/tama-*.tar.gz -C "$RUNNER_TEMP/release"
          source_dir=$(find "$RUNNER_TEMP/release" -mindepth 1 -maxdepth 1 -type d -name 'tama-*')
          echo "TAMA_RELEASE_SOURCE=${source_dir}" >> "$GITHUB_ENV"
          python -c "import importlib.util, pathlib, tama; assert importlib.util.find_spec('meep') is None; assert importlib.util.find_spec('tama_meep_native') is None; assert 'site-packages' in pathlib.Path(tama.__file__).parts"
      - name: Run installed CPU backend and isolation checks
        run: |
          cd "$TAMA_RELEASE_SOURCE"
          python -m pytest -q tests/common tests/fdtdx -m 'not fdtdx_gpu'
